<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No remote content, no inline eval: keep the CSP tight. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Agent Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
      <aside class="sidebar">
        <header class="sidebar__head">
          <h1 class="sidebar__title">Conversations</h1>
          <p class="sidebar__meta" id="summary">Scanning your disk…</p>
        </header>

        <div class="sidebar__search">
          <input
            id="search"
            type="search"
            placeholder="Filter by title or project…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>

        <nav class="sidebar__list" id="list" aria-label="Detected conversations">
          <div class="placeholder" id="list-placeholder">Scanning…</div>
        </nav>

        <footer class="sidebar__foot">
          <button id="refresh" class="btn" type="button">Rescan</button>
          <button id="fixtures" class="btn btn--ghost" type="button" title="Load the bundled sample stores instead of your own history">
            Demo data
          </button>
          <p class="sidebar__hint" id="progress"></p>
        </footer>
      </aside>

      <!-- ── Main panel ──────────────────────────────────────────────────── -->
      <main class="main" id="main">
        <div class="empty" id="empty">
          <h2>Pick a conversation</h2>
          <p>
            Everything in the list on the left was read from an AI agent's own history
            on this machine. Selecting one shows its transcript — that transcript is
            what gets sent to Gemini to build the quiz.
          </p>
        </div>

        <article class="session" id="session" hidden>
          <header class="session__head">
            <div class="session__titles">
              <h2 class="session__title" id="session-title"></h2>
              <p class="session__sub" id="session-sub"></p>
            </div>
            <div class="session__actions">
              <button id="show-payload" class="btn btn--ghost" type="button">
                Show Gemini payload
              </button>
              <button id="generate" class="btn btn--primary" type="button" disabled title="Quiz generation is the next piece">
                Generate quiz
              </button>
            </div>
          </header>
          <div class="session__messages" id="messages"></div>
        </article>

        <article class="payload" id="payload-view" hidden>
          <header class="session__head">
            <div class="session__titles">
              <h2 class="session__title">Gemini payload</h2>
              <p class="session__sub" id="payload-sub"></p>
            </div>
            <button id="close-payload" class="btn" type="button">Close</button>
          </header>
          <pre class="payload__json" id="payload-json"></pre>
        </article>
      </main>
    </div>

    <!-- type="module" is required: renderer.js imports components/ and lib/.
         This only works because the page is served from app:// rather than
         file:// — over file:// the origin is null, `script-src 'self'` matches
         nothing, and the module is refused silently. See main.js. -->
    <script type="module" src="renderer.js"></script>
  </body>
</html>
